# Docker-Compose document
# Ref : https://docs.docker.com/compose/compose-file/

name: ${PROJECT_NAME}

services:
  algo:
    image: nginx
    container_name: ${SRV_CONTAINER_NAME}-algo
    hostname: algo
    ports:
      - ${SRV_PORT}:80
    volumes:
      - ${PROJECT_DIR}/cache/data:/var/local/asa
    networks:
      - srv-network

networks:
  srv-network:
    driver: bridge
